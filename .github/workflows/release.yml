name: Release

# Тег vX.Y.Z → сборка TelegramAnonymizer.exe, проверка на примере и публикация в Releases.
# Ручной запуск (Actions → Release → Run workflow) только собирает .exe как артефакт.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Build TelegramAnonymizer.exe
        run: |
          python -m pip install --upgrade pyinstaller
          python -m PyInstaller --noconfirm --clean --onefile --console --name TelegramAnonymizer --add-data "builtin_names.txt;." app.py

      - name: Smoke test the .exe on the sample chat
        shell: cmd
        run: |
          mkdir smoke
          copy examples\sample_chat.json smoke\result.json
          echo.| dist\TelegramAnonymizer.exe smoke\result.json > smoke\log.txt
          type smoke\log.txt
          if not exist smoke\result_anon.json exit /b 1
          findstr /c:"!!" smoke\log.txt && exit /b 1
          exit /b 0

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory pkg/TelegramAnonymizer | Out-Null
          Copy-Item dist/TelegramAnonymizer.exe, names.example.txt, hide.example.txt, keep.example.txt, README.md, README.ru.md, LICENSE pkg/TelegramAnonymizer
          Compress-Archive pkg/TelegramAnonymizer TelegramAnonymizer-windows.zip
          "SHA-256 TelegramAnonymizer.exe: $((Get-FileHash dist/TelegramAnonymizer.exe -Algorithm SHA256).Hash)" | Tee-Object SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: TelegramAnonymizer-windows
          path: |
            dist/TelegramAnonymizer.exe
            TelegramAnonymizer-windows.zip
            SHA256.txt

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/TelegramAnonymizer.exe TelegramAnonymizer-windows.zip --clobber
          else
            gh release create "$tag" dist/TelegramAnonymizer.exe TelegramAnonymizer-windows.zip \
              --title "$tag" --generate-notes --notes "$(cat SHA256.txt)"
          fi
